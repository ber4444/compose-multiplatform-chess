app = "compose-chess-opening-coach"
primary_region = "sjc"

[build]
  # Resolved relative to this file's directory (server/), not the build context.
  # The context comes from the `.` in `fly deploy . --config server/fly.toml`.
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"
