# fly.toml app configuration file generated for compose-chess-opening-coach-db on 2026-07-28T17:35:39-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# DECOMMISSIONED — the deployed server no longer connects to this database.
#
# The corpus is read-only at request time (every INSERT in Database.kt is on the seed path) and is
# derived deterministically from server/corpus/*.tsv, so it is now embedded at image build time and
# served from memory; see CorpusIndexFile. This app was ~$3.97/month — an always-on machine, a 10 GB
# volume and its snapshots — to hold ~6 MB of data that was already in git.
#
# The config is kept, not deleted, because PostgresPassageRepository is still the reference
# implementation that InMemoryPassageRepository is pinned to, and because reviving the database is
# then a `fly deploy` rather than an archaeology exercise. Nothing in the runtime path needs it.
#
# To actually stop paying, destroy the app and its volume:
#   fly apps destroy compose-chess-opening-coach-db
# The volume goes with the app; confirm with `fly volumes list -a compose-chess-opening-coach-db`
# first if you want a snapshot kept.

app = 'compose-chess-opening-coach-db'
primary_region = 'sjc'

[env]
  PRIMARY_REGION = 'sjc'

# Pinned so a redeploy of this config can't silently resize the machine. These are the values it
# actually ran on: shared-cpu-1x at the 256 MB floor, which is why the Aug 2026 receipt's
# "Additional RAM" line was attributable entirely to the app machine.
[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  cpu_kind = 'shared'

[[mounts]]
  source = 'pg_data'
  destination = '/data'

[[services]]
  protocol = 'tcp'
  internal_port = 5432
  auto_start_machines = false

  [[services.ports]]
    port = 5432
    handlers = ['pg_tls']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[[services]]
  protocol = 'tcp'
  internal_port = 5433
  auto_start_machines = false

  [[services.ports]]
    port = 5433
    handlers = ['pg_tls']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 1000

[checks]
  [checks.pg]
    port = 5500
    type = 'http'
    interval = '15s'
    timeout = '10s'
    path = '/flycheck/pg'

  [checks.role]
    port = 5500
    type = 'http'
    interval = '15s'
    timeout = '10s'
    path = '/flycheck/role'

  [checks.vm]
    port = 5500
    type = 'http'
    interval = '15s'
    timeout = '10s'
    path = '/flycheck/vm'

[[metrics]]
  port = 9187
  path = '/metrics'
