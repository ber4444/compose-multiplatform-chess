name: Multiplatform CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 07:00 UTC daily — runs the opt-in depth-5/6 perft gate (PerftDeepTest) plus the full
    # Stockfish-backed Oracle 2 that's too slow / off-path for the per-commit gate.
    - cron: '0 7 * * *'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  instrumented-tests:
    name: Build + Android tests (API ${{ matrix.api-level }}, Device ${{ matrix.profile }} / ${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        include:
          - api-level: 35
            profile: pixel_7
            target: default

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install latest command-line tools
        run: |
          sdkmanager --install "cmdline-tools;latest"
          yes | sdkmanager --update

      - name: Update SDK tools
        run: yes | sdkmanager --update

      - name: Install emulator + system image
        run: sdkmanager "emulator" "system-images;android-${{ matrix.api-level }};${{ matrix.target }};x86_64"

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clean AVD state
        run: rm -rf ~/.android/avd/*

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

    # - name: AVD cache
    #   uses: actions/cache@v6
    #   id: avd-cache
    #   with:
    #     path: |
    #       ~/.android/avd/*
    #       ~/.android/adb*
    #     key: avd-${{ matrix.api-level }}

      - name: Show testing environment
        run: |
          echo "Running on API level: ${{ matrix.api-level }}"
          echo "Running on device: ${{ matrix.profile }}"
          echo "Building Android, Linux desktop, and Wasm targets"

      - name: Install desktop Filament native build prerequisites + Stockfish
        # stockfish is installed here (not just in the nightly) so the per-commit :chess-core:check
        # actually runs the PerftVsStockfish localizer (Oracle 2) instead of silently skipping it.
        # It's a single apt package, so the wall-time cost is negligible vs. the Filament deps.
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libegl1-mesa-dev libx11-dev stockfish

      - name: Fetch desktop Filament dependencies
        run: tools/fetch_filament_desktop.sh

      - name: Build Android, Linux desktop, and Wasm targets
        # :chess-core:check runs the full per-target test matrix including :chess-core:desktopTest,
        # which carries the perft rig (PerftCanonicalGateTest, PerftVsStockfishTest, PerftDeepTest).
        # PerftDeepTest assume-skips without -Dperft.deep=true (intentional — it's nightly-only).
        # :perft-mcp:test runs the MCP adapter's unit tests (parser, repo-root discovery, tool registration).
        run: ./gradlew :chess-core:check :perft-mcp:test :androidApp:assembleDebug :app:assembleAndroidDeviceTest :app:check :app:desktopJar :app:packageDistributionForCurrentOS :app:wasmJsBrowserDistribution

      - name: Report perft localizer status
        # Surface whether Oracle 2 (PerftVsStockfishTest) ran or skipped, so a missing stockfish is
        # a visible warning in the run summary rather than a silent green. Mirrors the apple-kotlin job.
        if: always()
        run: |
          xml="$(find chess-core/build/test-results -name '*PerftVsStockfish*.xml' 2>/dev/null | head -1 || true)"
          if [ -z "$xml" ]; then
            echo "### ⚠️ Perft Stockfish localizer: NOT RUN (PerftVsStockfishTest produced no result file)" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '<skipped' "$xml"; then
            echo "### ⚠️ Perft Stockfish localizer: SKIPPED (stockfish binary not available)" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '<failure' "$xml"; then
            echo "### Perft Stockfish localizer: ran (with failures — see report)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Perft Stockfish localizer: ran" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          profile: ${{ matrix.profile }}
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-boot-timeout: 600  # Increase boot timeout to 10 minutes
          emulator-options: >
            -no-snapshot-save
            -noaudio
            -no-boot-anim
            -gpu swiftshader_indirect
            -camera-back none
            -no-window
            -grpc 8554
            -grpc-use-jwt
            -memory 2048
            -cores 2
          script: |
            echo "grpc.allowlist=*" >> ~/.android/avd/test.avd/config.ini
            ./gradlew :app:connectedAndroidDeviceTest

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-api-${{ matrix.api-level }}-device-${{ matrix.profile }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/

  # The Apple checks are split into two jobs that run concurrently (Kotlin + Xcode). The previous
  # single job ran them sequentially (~9 min of heavy work); splitting caps wall-clock at the
  # slower of the two instead of their sum, bringing the Apple pipeline in line with the Android one.
  apple-kotlin:
    name: Build + Kotlin checks (iOS sim/desktop tests)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache desktop Filament payload + built bridge
        id: filament-desktop
        uses: actions/cache@v6
        with:
          # The fetched Filament headers/libs (fetch_filament_desktop.sh) AND the CMake-built JNI
          # bridge (.dylib). Both are reproducible from the bridge C++ + the pinned Filament version,
          # so caching skips the ~hundreds-of-MB download AND the cmake configure+compile every run.
          path: |
            app/src/desktopMain/filament/filament
            app/build/desktop-filament-native
          key: filament-desktop-${{ runner.os }}-${{ hashFiles('app/src/desktopMain/native/filament_bridge/**') }}
          restore-keys: |
            filament-desktop-${{ runner.os }}-

      - name: Fetch desktop Filament dependencies
        if: steps.filament-desktop.outputs.cache-hit != 'true'
        run: tools/fetch_filament_desktop.sh

      - name: Install Stockfish (for the perft Stockfish oracle / localizer)
        # PerftVsStockfishTest (Oracle 2) lives in :chess-core and degrades to "skipped" without a
        # binary; installing stockfish here makes the canonical + random-walk divide diff actually
        # run on every PR. Without this the localizer silently skips and the per-commit perft gate
        # only exercises the canonical static-count oracle, not the Stockfish cross-check.
        run: brew install stockfish

      - name: Ensure test simulator exists
        run: |
          # Match the EXACT device name ("iPhone 16 (" in the simctl listing) so a pre-installed
          # "iPhone 16 Pro"/"Plus" doesn't satisfy the check and leave the Kotlin/Native test runner
          # failing with "Invalid device: iPhone 16" (runner images vary in which sims ship).
          if ! xcrun simctl list devices available | grep -qE "iPhone 16 \("; then
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16"
          fi
          xcrun simctl list devices available | grep -E "iPhone 16 \(" || true

      - name: Kotlin checks (simulator unit+UI tests, desktop tests)
        # --parallel runs the independent iosSimulatorArm64Test / desktopTest targets concurrently.
        # Two desktopTest tasks run here:
        #   - :app:desktopTest      — the macOS-only C++ Filament bridge .dylib + desktop renderer
        #                             tests the Linux runner cannot run (kept for that reason).
        #   - :chess-core:desktopTest — the perft rig (PerftCanonicalGateTest + PerftVsStockfishTest
        #                             + PerftDeepTest). The perft tests moved to :chess-core in the
        #                             "move perft tests to chess-core" commit; without this target the
        #                             per-commit perft gate would be a silent no-op (a `--tests "*Perft*"`
        #                             filter on :app:desktopTest matches nothing post-move).
        # NOTE: linkDebugFrameworkIosArm64 (the iOS *device* framework) was removed — CI tests on the
        # simulator, and the xcode job builds its own framework via embedAndSignAppleFrameworkForXcode,
        # so the device link was ~2.5min of dead weight. (configuration-cache is intentionally NOT
        # enabled — the build's reflection-based task config is incompatible with it; see build.gradle.kts.)
        run: ./gradlew --parallel :app:iosSimulatorArm64Test :app:desktopTest :chess-core:desktopTest "-PiosSimulatorDeviceId=iPhone 16"

      - name: Report perft localizer status
        # Surface whether Oracle 2 (PerftVsStockfishTest) ran or skipped, so a missing stockfish is
        # a visible warning in the run summary rather than a silent green. Mirrors the Linux job.
        if: always()
        run: |
          xml="$(find chess-core/build/test-results -name '*PerftVsStockfish*.xml' 2>/dev/null | head -1 || true)"
          if [ -z "$xml" ]; then
            echo "### ⚠️ Perft Stockfish localizer: NOT RUN (PerftVsStockfishTest produced no result file)" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '<skipped' "$xml"; then
            echo "### ⚠️ Perft Stockfish localizer: SKIPPED (stockfish binary not available)" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '<failure' "$xml"; then
            echo "### Perft Stockfish localizer: ran (with failures — see report)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Perft Stockfish localizer: ran" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-kotlin-test-reports
          path: |
            app/build/reports/tests/
            chess-core/build/reports/tests/

  apple-xcode:
    name: Build + Xcode checks (iOS app Swift tests)
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache iOS Filament payload + KTX resources
        id: filament-ios
        uses: actions/cache@v6
        with:
          # fetch_filament_ios.sh stages TWO things: the Filament xcframeworks (Filament/filament)
          # AND the papermill KTX IBL/skybox assets (Resources/*.ktx) that xcodebuild's CpResource
          # step copies into the app bundle. Both must be cached together, or a cache hit leaves the
          # .ktx files missing and xcodebuild fails with "No such file or directory".
          path: |
            iosApp/iosApp/Filament/filament
            iosApp/iosApp/Resources
          # `-v2` busts an earlier cache that stored only Filament/filament (missing the Resources/
          # KTX assets), which left xcodebuild's CpResource step failing on cache hit.
          key: filament-ios-v2-${{ hashFiles('tools/fetch_filament_ios.sh') }}
          restore-keys: |
            filament-ios-v2-

      - name: Fetch iOS Filament dependencies
        if: steps.filament-ios.outputs.cache-hit != 'true'
        run: tools/fetch_filament_ios.sh

      - name: Cache Xcode DerivedData + Swift Package Manager
        id: xcode-build
        uses: actions/cache@v6
        with:
          # DerivedData holds the built app + ChessKitEngine framework; the SPM cache holds the
          # resolved package artifacts. Both are keyed on the iOS app sources + the pinned SPM version
          # so xcodebuild's incremental build skips recompiling ChessKitEngine from scratch each run.
          path: |
            iosApp/build/DerivedData
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: xcode-derived-${{ hashFiles('iosApp/iosApp/**/*.swift', 'iosApp/iosApp/**/*.mm', 'iosApp/project.yml', 'app/src/iosMain/**') }}
          restore-keys: |
            xcode-derived-

      - name: Show Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -30

      - name: Install Stockfish (for Oracle 2 perft divide diff)
        # PerftVsStockfishTest degrades to "skipped" without a binary; installing stockfish
        # here makes the canonical + random-walk diff actually run on every PR.
        run: brew install stockfish

      - name: Ensure test simulator exists
        run: |
          if ! xcrun simctl list devices available | grep -qE "iPhone 16 \("; then
            xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16"
          fi

      - name: Build and test iosApp
        # xcodebuild's own Run-Script build phase calls `./gradlew :app:embedAndSignAppleFrameworkForXcode`,
        # so the Kotlin ChessApp framework is built as part of this step — no separate Gradle link needed.
        # -derivedDataPath pins the build output so the cache above can reuse it across runs.
        #
        # -skip-testing:iosAppUITests: the iosAppUITests bundle still COMPILES here (it's in the
        # scheme's build targets, so Swift compile errors are still caught), but its single test —
        # OnDeviceBenchUITests.testColdInitBenchmark, which relaunches the app 20× via XCUIApplication
        # to collect on-device AI cold-init samples — is not EXECUTED in CI. Per docs/benchmark-harness.md
        # it's a manual, physical-device-only benchmark ("You must run benchmarks on physical devices,
        # not emulators/simulators"). On the CI simulator its 20× launch loop intermittently hits
        # "Failed to get background assertion for target app", flaking ~1-in-N PRs that are otherwise
        # unrelated to iOS (e.g. server-only dep bumps). Run it locally against a real device instead.
        # The real Swift unit tests (iosAppTests → StockfishChessEngineTests) still run below.
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest,arch=arm64" \
            -derivedDataPath iosApp/build/DerivedData \
            -parallel-testing-enabled NO \
            -skip-testing:iosAppUITests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: apple-xcode-test-reports
          path: |
            iosApp/build/DerivedData/Logs/Test
            app/build/reports/tests/

  perft-nightly:
    name: Perft deep + Stockfish oracle (nightly)
    # Runs on schedule (see top-level `on:`) and on manual dispatch. Skipped on ordinary
    # push/PR — the per-commit perft gate is already covered by :app:check (commonTest) and
    # :app:desktopTest in the jobs above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@v5.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      # PerftDeepTest gates on -Dperft.deep=true (see chess-core/build.gradle.kts systemProperty
      # forwarding). Without the flag the deep tests assume-skip; the broad --tests filter
      # also re-runs the always-on canonical gate + Oracle 2 so the nightly exercises the
      # full perft surface, not just the deep half.
      # NOTE: the target is :chess-core:desktopTest, NOT :app:desktopTest — the perft tests moved
      # to :chess-core, and a `--tests "*Perft*"` filter on :app:desktopTest matches zero tests
      # post-move (silent green no-op). See docs/plans/perft-ci-completion.md.
      - name: Install Stockfish (for Oracle 2 perft divide diff)
        run: sudo apt-get update && sudo apt-get install -y stockfish

      - name: Run deep perft gate + full Stockfish oracle
        run: ./gradlew :chess-core:desktopTest --tests "*Perft*" -Dperft.deep=true

      - name: Upload divergence report on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: perft-divergence-report
          path: build/perft-divergence.txt
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: perft-nightly-reports
          path: chess-core/build/reports/tests/
