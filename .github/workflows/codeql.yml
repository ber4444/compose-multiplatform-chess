name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    # Still needed on Kotlin 2.4.20 final. The java-kotlin extractor halts with `Kotlin version
    # <v> is too recent` for any version above the newest entry in the CodeQL repo's
    # `java/kotlin-extractor/versions.bzl`, and the latest released CLI — 2.27.0, checked
    # 2026-09-09 — still tops out at 2.4.0. Support for 2.4.20 is merged on codeql `main` but has
    # not shipped in a CLI release yet.
    #
    # Removal condition, so this does not outlive its cause: check that tag's versions.bzl lists
    # 2.4.20, then delete this line and the two step-level `continue-on-error` keys below.
    #
    # Note what non-blocking costs while it is on: java-kotlin analysis reports green whether it
    # extracted this repo or nothing at all, so it is not evidence of coverage until it is removed.
    continue-on-error: ${{ matrix.language == 'java-kotlin' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Swift analysis needs a macOS runner and ~2h, so it is skipped on pull_request and left to
        # the push-to-main and weekly scheduled runs.
        #
        # This selection lives in the matrix, NOT in a job-level `if:`. `jobs.<job_id>.if` is
        # evaluated before the matrix expands and therefore has no `matrix` context — referencing it
        # there makes the entire workflow file invalid, which GitHub reports as a 0-second run named
        # after the file path rather than the workflow. (`runs-on`, `timeout-minutes`, `name` and
        # `steps` below *do* have matrix context; `if` at job level is the exception.)
        #
        # `build-mode` is derived per step rather than via `include:`, because an `include` entry
        # whose `language` is absent from the list creates a *new* combination instead of annotating
        # one — which would silently add Swift back on pull requests.
        language: ${{ fromJSON(github.event_name == 'pull_request' && '["actions","c-cpp","java-kotlin","javascript-typescript"]' || '["actions","c-cpp","java-kotlin","javascript-typescript","swift"]') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK
      if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      if: matrix.language == 'java-kotlin' || matrix.language == 'swift'
      uses: gradle/actions/setup-gradle@v6

    - name: Cache iOS Filament payload
      if: matrix.language == 'swift'
      id: cache_ios_filament
      uses: actions/cache@v4
      with:
        # Includes the fetched xcframeworks/libs/headers and the KTX IBL assets
        # the fetch script stages into the app bundle. fetch_filament_ios.sh is
        # idempotent (rsync --delete), so we skip it entirely on a cache hit.
        path: |
          iosApp/iosApp/Filament/filament
          iosApp/iosApp/Resources/papermill_ibl.ktx
          iosApp/iosApp/Resources/papermill_skybox_blurred.ktx
        key: filament-ios-v1.72.0-${{ hashFiles('tools/fetch_filament_ios.sh') }}

    - name: Fetch iOS Filament dependencies
      if: matrix.language == 'swift' && steps.cache_ios_filament.outputs.cache-hit != 'true'
      run: tools/fetch_filament_ios.sh

    - name: Cache SwiftPM packages
      if: matrix.language == 'swift'
      uses: actions/cache@v4
      with:
        # Caches dependency resolution/clone only (not build artifacts), so the
        # Swift compiler still runs under CodeQL tracing as required. The clone
        # dir is pinned below via -clonedSourcePackagesDirPath on every xcodebuild.
        path: .build/SwiftPM
        key: swiftpm-${{ runner.os }}-${{ hashFiles('iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

    - name: Ensure test simulator exists
      if: matrix.language == 'swift'
      run: |
        if ! xcrun simctl list devices available | grep -qE "iPhone 16 \("; then
          xcrun simctl create "iPhone 16" "com.apple.CoreSimulator.SimDeviceType.iPhone-16"
        fi

    - name: Pre-build everything (Swift optimization)
      if: matrix.language == 'swift'
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -destination "platform=iOS Simulator,name=iPhone 16,OS=latest,arch=arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES DEBUG_INFORMATION_FORMAT=dwarf -clonedSourcePackagesDirPath .build/SwiftPM build

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ (matrix.language == 'java-kotlin' || matrix.language == 'swift' || matrix.language == 'c-cpp') && 'manual' || 'none' }}
        # Trim vendored Filament/Stockfish payloads, build output, and test
        # sources from analysis — see .github/codeql-config.yml.
        config-file: .github/codeql-config.yml

    - name: Cache Filament desktop payload
      if: matrix.language == 'java-kotlin' || matrix.language == 'c-cpp'
      id: cache_desktop_filament
      uses: actions/cache@v4
      with:
        path: app/src/desktopMain/filament/filament
        key: filament-desktop-v1.72.0-${{ runner.os }}-${{ hashFiles('tools/fetch_filament_desktop.sh') }}

    - name: Fetch Filament desktop dependencies
      if: (matrix.language == 'java-kotlin' || matrix.language == 'c-cpp') && steps.cache_desktop_filament.outputs.cache-hit != 'true'
      run: tools/fetch_filament_desktop.sh

    - name: Build Java-Kotlin and C-CPP
      continue-on-error: ${{ matrix.language == 'java-kotlin' }}

      if: matrix.language == 'java-kotlin' || matrix.language == 'c-cpp'
      run: ./gradlew :chess-core:compileAndroidMain :app:compileAndroidMain :androidApp:assembleDebug :app:desktopJar

    - name: Force Swift recompilation
      if: matrix.language == 'swift'
      run: find iosApp -name "*.swift" -o -name "*.m" -o -name "*.mm" -exec touch {} +

    - name: Build Swift (Traced)
      if: matrix.language == 'swift'
      run: |
        xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -destination "platform=iOS Simulator,name=iPhone 16,OS=latest,arch=arm64" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ONLY_ACTIVE_ARCH=YES DEBUG_INFORMATION_FORMAT=dwarf -clonedSourcePackagesDirPath .build/SwiftPM build

    - name: Perform CodeQL Analysis
      continue-on-error: ${{ matrix.language == 'java-kotlin' }}

      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
