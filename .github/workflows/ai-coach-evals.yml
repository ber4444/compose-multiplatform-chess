name: AI coach evals

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'onDeviceAi/**'
      - 'coachApi/**'
      - 'server/**'
      - 'evals/**'
      - 'app/src/**/opening/**'
      - 'app/src/**/chat/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ai-coach-evals.yml'
  push:
    branches: [ main ]
    paths:
      - 'onDeviceAi/**'
      - 'coachApi/**'
      - 'server/**'
      - 'evals/**'
      - 'app/src/**/opening/**'
      - 'app/src/**/chat/**'
      - 'settings.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ai-coach-evals.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  evals:
    name: Grounding regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The server suite ran nowhere in CI until now: android-tests.yml never referenced :server:,
      # and this workflow only ran :evals:run. Both the retrieval grounding gate and every
      # composer/validator test were unprotected. GitHub-hosted ubuntu runners ship Docker, so the
      # Testcontainers-backed Postgres tests execute here.
      - name: Run server tests (Testcontainers Postgres)
        run: ./gradlew :server:test

      # A silently-skipped suite is indistinguishable from a passing one: the Testcontainers tests
      # are annotated `disabledWithoutDocker = true`, so a runner image without Docker would make
      # this job green while the retrieval gate never executed. Fail loudly instead. Mirrors the
      # perft localizer status step in android-tests.yml.
      - name: Verify the retrieval grounding gate actually ran
        if: always()
        run: |
          xml="$(find server/build/test-results -name '*OpeningRetrievalGroundingTest*.xml' 2>/dev/null | head -1 || true)"
          if [ -z "$xml" ]; then
            echo "### ❌ Retrieval grounding gate: NOT RUN (no result file)" >> "$GITHUB_STEP_SUMMARY"
            echo "OpeningRetrievalGroundingTest produced no result file — the suite did not execute." >&2
            exit 1
          elif grep -q '<skipped' "$xml"; then
            echo "### ❌ Retrieval grounding gate: SKIPPED (Docker unavailable)" >> "$GITHUB_STEP_SUMMARY"
            echo "OpeningRetrievalGroundingTest was skipped — Docker is required for this gate." >&2
            exit 1
          elif grep -q '<failure' "$xml"; then
            echo "### Retrieval grounding gate: ran (with failures — see report)" >> "$GITHUB_STEP_SUMMARY"
          else
            tests="$(grep -o 'tests="[0-9]*"' "$xml" | head -1)"
            echo "### ✅ Retrieval grounding gate: ran ($tests)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload server test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-results
          path: server/build/test-results/test/
          if-no-files-found: warn

      # The harness's own suites ran in no workflow at all: android-tests.yml never references
      # :evals: and this job only ran :evals:run, which does not depend on `test`. So the mutation
      # test that proves the routing sweep can go red, and the fixtures that prove the retrieval
      # gate can fail, were themselves ungated — a checker nobody checks.
      - name: Run eval harness tests
        run: ./gradlew :evals:test

      - name: Run fake, fallback, and local-server evals
        run: ./gradlew :evals:run

      # The scorecard's optional rows (cloud provider, live deployment) are absent here by design —
      # CI has no key and no deployment. Absent must not read as clean, so the banner the harness
      # writes is lifted into the job summary rather than left inside an artifact nobody opens.
      # Same reasoning as the retrieval-gate skip detector above.
      - name: Report routes that were not collected
        if: always()
        run: |
          if grep -q "Not collected in this run" evals/scorecard.md; then
            sed -n '/Not collected in this run/,/^$/p' evals/scorecard.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Every scorecard route was collected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-coach-scorecard
          path: evals/scorecard.md
          if-no-files-found: error
