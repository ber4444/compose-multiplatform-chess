# Dependabot configuration.
#
# This repo relies on Dependabot *security* updates (enabled in the repo's Security settings);
# it does NOT run scheduled version updates. This file exists only to scope `ignore` rules onto
# the build/test-only BouncyCastle + Netty versions we pin via buildscript `constraints`
# (build.gradle.kts / settings.gradle.kts) to override the vulnerable copies AGP bundles
# (apksig -> BouncyCastle, Unified Test Platform -> grpc-netty -> Netty). Neither ships in the
# app or the published :chess-core artifact -- they run only on a build/CI machine.
#
# `open-pull-requests-limit: 0` keeps scheduled version updates OFF (so this file does not start
# opening version-bump PRs for the whole Gradle graph) while the `ignore` conditions still apply
# to security-update PRs.
#
# The current pins (BouncyCastle 1.84, netty 4.1.136.Final) already satisfy every open advisory. We
# block only the disruptive *series* jumps Dependabot keeps proposing (see closed PR #82):
#   - Netty 4.1 -> 4.2 would force grpc-netty 1.69.1 (AGP's Unified Test Platform emulator-control
#     gRPC path) onto a minor series it was not built against.
# In-series patches (e.g. a future 4.1.x) are still allowed so genuine fixes get through.
#
# The BouncyCastle ignore is GONE, and the reason it existed is worth recording. It blocked
# bcprov 1.81+ because raising bcprov alone desynced it from AGP's 1.79 bcpkix/bcutil. That held
# only while bcprov was the sole module under advisory. GHSA-wg6q-6289-32hp (bcpkix, empty
# signature sequence accepted as valid) and GHSA-c3fc-8qff-9hwx (bcprov, LDAP injection) are both
# fixed in 1.84, so the buildscript now pins bcprov + bcpkix + bcutil to 1.84 together and there is
# no skew left to protect against. Re-adding a bcprov-only ignore would re-create it.
#
# NOTE: :server intentionally runs Netty 4.2.x (ktor-server-netty's own series, pinned via
# `platform("io.netty:netty-bom:...")` in server/build.gradle.kts). The `>= 4.2.0` ignore below is
# name-scoped, not module-scoped, so it suppresses security PRs for that BOM too — bump the server's
# netty-bom by hand when a 4.2.x advisory lands (the alert itself still fires either way).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Stay on Netty 4.1.x; block the 4.2.x series jump (grpc-netty 1.69.1 compatibility).
      - dependency-name: "io.netty:*"
        versions: [">= 4.2.0"]
