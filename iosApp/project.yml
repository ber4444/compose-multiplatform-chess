name: iosApp
options:
  bundleIdPrefix: io.github.ber4444
  deploymentTarget:
    iOS: "16.0"          # floor set by ChessKitEngine (.iOS(.v16))
  createIntermediateGroups: true
# iOS uses Metal-native Filament for the 3D board. Run tools/fetch_filament_ios.sh after a clean
# checkout to install the gitignored Filament xcframeworks and staged KTX IBL resources.
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"   # required by embedAndSignAppleFrameworkForXcode
packages:
  ChessKitEngine:
    url: https://github.com/chesskit-app/chesskit-engine
    exactVersion: 0.6.0   # 0.7.0 needs swift-tools 6.2 (Xcode 26+); bump deliberately
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        # Filament/filament/** is the fetched Filament release (headers + xcframeworks); it is linked
        # via filament.xcconfig, not compiled as target sources, so keep xcodegen from globbing it.
        excludes: ["Resources/**", "Filament/filament/**"]
      - path: iosApp/Resources
        buildPhase: resources          # .nnue + glb + KTX assets must land in the app bundle
        excludes: ["papermill_*.hdr"]
    dependencies:
      - package: ChessKitEngine
    info:
      path: iosApp/Info.plist
      properties:
        # Allow Pro Motion (120 Hz) on iPhone — without this, UIKit caps frame rate at 60 and the
        # 3D board's orbit feels noticeably choppier than the desktop target. xcodegen drops
        # unknown keys from a hand-edited Info.plist on regen, so the key has to live here.
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ber4444.chess
        # Only ChessApp is linked directly; OnDeviceAi is exported into ChessApp
        # via `export(project(":onDeviceAi"))` in app/build.gradle.kts to avoid
        # KT-42254 (duplicate Kotlin/Native runtime injection).
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ChessApp"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    # Filament header/library search paths, static-lib link flags, and the Swift bridging header live
    # in this xcconfig. The libraries it points at are fetched separately and intentionally gitignored.
    configFiles:
      Debug: iosApp/Filament/filament.xcconfig
      Release: iosApp/Filament/filament.xcconfig
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${JAVA_HOME:-}" ]; then export JAVA_HOME=$(/usr/libexec/java_home 2>/dev/null || true); fi
          cd "$SRCROOT/.."
          ./gradlew :app:embedAndSignAppleFrameworkForXcode
  iosAppTests:
    type: bundle.unit-test
    platform: iOS
    sources: [iosAppTests]
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ber4444.chess.tests
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/iosApp.app/iosApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iosAppUITests]
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ber4444.chess.uitests
        TEST_TARGET_NAME: iosApp
schemes:
  iosApp:
    build:
      targets: { iosApp: all }
    run:
      config: Debug
    test:
      config: Debug
      targets: [iosAppTests, iosAppUITests]
