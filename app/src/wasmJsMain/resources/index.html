<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess</title>
    <!--
      Must be a module script. The bundle keeps a bare `import.meta` (kotlinx-io's Node shim,
      reached through Ktor), which is a SyntaxError in a classic script: the whole file fails
      to parse and the page stays blank. Module scripts are deferred by default.
    -->
    <script type="module" src="app.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #fff;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        /*
          ComposeTarget must stay at the top-left of the page. The 3D board's Filament canvas is
          positioned absolutely against <body> from Compose's window coordinates
          (WasmBoard3D.kt), so anything placed above the Compose area would shift the board away
          from the hole Compose punches for it. The store links therefore go below it.
        */
        #ComposeTarget {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: block;
        }
        #store-links {
            flex: 0 0 auto;
            padding: 6px 12px;
            font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            color: #444;
            background-color: #f3f3f3;
            border-top: 1px solid #ddd;
        }
        #store-links a {
            color: #00695c;
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
        }
        #store-links a:hover {
            text-decoration: underline;
        }
        @media (prefers-color-scheme: dark) {
            html, body {
                background-color: #141218;
            }
            #store-links {
                color: #cac4d0;
                background-color: #1d1b20;
                border-top-color: #49454f;
            }
            #store-links a {
                color: #80cbc4;
            }
        }
    </style>
</head>
<body>
    <div id="ComposeTarget"></div>
    <footer id="store-links">
        AI coaching features are available in the mobile apps only:
        <a href="https://play.google.com/store/apps/details?id=io.github.ber4444.chess" target="_blank" rel="noopener">Google Play</a>
        ·
        <a href="https://testflight.apple.com/join/sXp1vXd5" target="_blank" rel="noopener">iOS (TestFlight)</a>
    </footer>
</body>
</html>
